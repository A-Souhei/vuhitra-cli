<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Vuhitra CLI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .error-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .error-content {
            text-align: center;
            color: white;
            max-width: 600px;
        }

        .error-code {
            font-size: 10rem;
            font-weight: 900;
            line-height: 1;
            margin-bottom: 1rem;
            text-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            background: linear-gradient(135deg, #ffffff 0%, #e0e7ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .error-icon {
            font-size: 8rem;
            margin-bottom: 1.5rem;
            opacity: 0.9;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.7; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.1); }
        }

        .error-title {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 1rem;
            text-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        }

        .error-message {
            font-size: 1.25rem;
            margin-bottom: 2rem;
            opacity: 0.95;
            line-height: 1.6;
        }

        .error-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-home {
            background: white;
            color: #667eea;
            padding: 1rem 2.5rem;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1.1rem;
            border: none;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
        }

        .btn-home:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.3);
            color: #667eea;
        }

        .btn-back {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            color: white;
            padding: 1rem 2.5rem;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1.1rem;
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
        }

        .btn-back:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.25);
            background: rgba(255, 255, 255, 0.3);
            color: white;
        }

        .helpful-links {
            margin-top: 3rem;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .helpful-links h5 {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            color: white;
        }

        .link-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            text-align: center;
        }

        .link-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 1.25rem;
            border-radius: 12px;
            transition: all 0.3s ease;
            text-decoration: none;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .link-item:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-3px);
            color: white;
        }

        .link-item i {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            display: block;
        }

        .link-item span {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .footer {
            background: rgba(0, 0, 0, 0.2);
            padding: 1.5rem 0;
            color: white;
            text-align: center;
        }

        .footer a {
            color: white;
            text-decoration: none;
            font-weight: 600;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .error-code {
                font-size: 6rem;
            }

            .error-icon {
                font-size: 5rem;
            }

            .error-title {
                font-size: 2rem;
            }

            .error-message {
                font-size: 1.1rem;
            }

            .btn-home, .btn-back {
                width: 100%;
                justify-content: center;
            }

            .link-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-content">
            <div class="error-icon">
                <i class="bi bi-exclamation-triangle-fill"></i>
            </div>
            <div class="error-code">404</div>
            <h1 class="error-title">Page Not Found</h1>
            <p class="error-message">
                Oops! The page you're looking for doesn't exist or has been moved.
                Don't worry, let's get you back on track!
            </p>

            <div class="error-actions">
                <a href="/home" class="btn-home">
                    <i class="bi bi-house-fill"></i>
                    Go Home
                </a>
                <a href="javascript:history.back()" class="btn-back">
                    <i class="bi bi-arrow-left"></i>
                    Go Back
                </a>
            </div>

            <div class="helpful-links">
                <h5><i class="bi bi-signpost-2-fill"></i> Quick Links</h5>
                <div class="link-grid">
                    <a href="/home" class="link-item">
                        <i class="bi bi-house"></i>
                        <span>Home</span>
                    </a>
                    <a href="/eternals" class="link-item">
                        <i class="bi bi-infinity"></i>
                        <span>Eternals</span>
                    </a>
                    <a href="/pillars" class="link-item">
                        <i class="bi bi-building"></i>
                        <span>Pillars</span>
                    </a>
                    <a href="/ephemerals" class="link-item">
                        <i class="bi bi-clock-history"></i>
                        <span>Ephemerals</span>
                    </a>
                    <a href="/vanishers" class="link-item">
                        <i class="bi bi-eye-slash"></i>
                        <span>Vanishers</span>
                    </a>
                    <a href="/mirrors" class="link-item">
                        <i class="bi bi-folder-symlink"></i>
                        <span>Mirrors</span>
                    </a>
                    <a href="/mcps" class="link-item">
                        <i class="bi bi-plugin"></i>
                        <span>MCPs</span>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <p class="mb-1">
                <i class="bi bi-c-circle"></i> 2025 Vuhitra CLI -
                Licensed under <a href="https://opensource.org/licenses/MIT" target="_blank">MIT License</a>
            </p>
            <p class="mb-0">
                <i class="bi bi-github"></i>
                <a href="https://github.com/A-Souhei/vuhitra-cli" target="_blank">View on GitHub</a>
            </p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
