[tool.poetry]
name = "vuhitra-cli"
version = "0.1.0"
description = "a minimalist? cli to use ollama LLM"
authors = ["toavina <toavinahajaina@gmail.com>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
requests = "^2.32.5"
pyyaml = "^6.0.3"
sentry-sdk = "^2.0.0"
redis = "^5.0.0"
elasticsearch = "^8.0.0"
spacy = "^3.7.0"
vadersentiment = "^3.3.2"
nltk = "^3.8.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-mock = "^3.12.0"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning:spacy.*:",
    "ignore::DeprecationWarning:click.*:",
]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
