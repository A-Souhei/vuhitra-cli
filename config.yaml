# Configuration file for vuhitra-cli
# This file contains settings for the LLM CLI application

# CLI settings
cli:
  # Default prompt behavior, timeout, etc.
  default_timeout: 30
  # Enable/disable feedback collection in interactive mode
  enable_feedback: true

# Model configuration
model:
  # Default model to use
  default: llama3.1:8b
  # Available models list
  available:
    - llama3.1:8b
    - qwen3-vl:8b
    - qwen3:latest
    - qwen2-math:1.5b
    - qwen2-math:7b
    - qwen2.5-coder:7b-instruct-q5_K_M
    - qwen2.5-coder:14b-instruct-q4_K_M
    - qwen2.5-coder:3b
    - qwen2.5-coder:7b-instruct-q4_K_M
    - qwen2.5-coder:7b

# Ollama server configuration
ollama:
  host: 192.168.31.23
  protocol: http
  port: 11434
  api_path: /api/generate

# Environment configuration
environment:
  # Mode: DEV or PROD (default: DEV)
  mode: DEV
  # Enable logging in DEV mode
  enable_logging: true

# Sentry configuration for error tracking
sentry:
  # Sentry DSN (leave empty to disable Sentry)
  dsn: ""
  # Environment name for Sentry
  environment: development
  # Enable tracing
  traces_sample_rate: 1.0
  # Send default PII (Personally Identifiable Information)
  send_default_pii: false
  # Attach stacktrace
  attach_stacktrace: true

# Sandbox service configuration
sandbox:
  host: localhost
  port: 8000
  protocol: http

# ElasticSearch configuration
elasticsearch:
  host: localhost
  port: 9200
  index: llm_feedback
