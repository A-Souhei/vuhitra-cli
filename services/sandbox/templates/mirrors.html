<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📁 Mirror Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/mirrors.css') }}">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container">
            <a class="navbar-brand" href="/home">
                <i class="bi bi-house-fill"></i> Vuhitra CLI
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/home">
                            <i class="bi bi-house"></i> Home
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/eternals">
                            <i class="bi bi-infinity"></i> Eternals
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/pillars">
                            <i class="bi bi-building"></i> Pillars
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/ephemerals">
                            <i class="bi bi-clock-history"></i> Ephemerals
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/vanishers">
                            <i class="bi bi-eye-slash"></i> Vanishers
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/mirrors">
                            <i class="bi bi-folder-symlink"></i> Mirrors
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/mcps">
                            <i class="bi bi-plugin"></i> MCPs
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="main-content">
        <div class="container">
            <div class="container-custom">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h1 class="header-title mb-0">
                            <i class="bi bi-folder-symlink"></i> Mirror Management
                        </h1>
                        <p class="text-muted small mb-0">Manage file synchronization between host and sandbox</p>
                    </div>
                    <button class="btn btn-primary" onclick="loadMirrors()">
                        <i class="bi bi-arrow-clockwise"></i> Refresh
                    </button>
                </div>

                <div id="message"></div>

                <div id="mirrorContainer">
                    <div class="text-center py-5">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                        <p class="text-muted mt-2">Loading mirrors...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <p class="mb-1">
                <i class="bi bi-c-circle"></i> 2025 Vuhitra CLI - 
                Licensed under <a href="https://opensource.org/licenses/MIT" target="_blank">MIT License</a>
            </p>
            <p class="mb-0">
                <i class="bi bi-github"></i> 
                <a href="https://github.com/A-Souhei/vuhitra-cli" target="_blank">View on GitHub</a>
            </p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/mirrors.js') }}"></script>
</body>
</html>
