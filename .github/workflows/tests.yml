name: Tests

on:
  # Only run on pull requests (right before merge)
  pull_request:
    branches: [ master, main, develop ]
  # Allow manual trigger if needed
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Create .env file for config tests
      run: |
        cd services
        cp .env.example .env
        sed -i 's/REDIS_PASSWORD=.*/REDIS_PASSWORD=testpassword123/' .env

    - name: Run non-container tests
      env:
        REDIS_PASSWORD: testpassword123
      run: |
        chmod +x run_tests.sh
        # Run only non-container tests (mocked tests) to reduce Actions consumption
        ./run_tests.sh -v
    
    - name: Upload coverage reports
      uses: codecov/codecov-action@v4
      if: matrix.python-version == '3.12'
      with:
        fail_ci_if_error: false
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

