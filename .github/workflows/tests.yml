name: Tests

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Start sandbox container
      run: |
        cd services
        export REDIS_PASSWORD=testpassword123
        docker compose up -d
        echo "Waiting for container to be healthy..."
        sleep 10
        docker compose ps
    
    - name: Wait for services to be ready
      run: |
        export REDIS_PASSWORD=testpassword123
        echo "Waiting for Redis to be ready..."
        for i in {1..30}; do
          if docker exec -e REDISCLI_AUTH="testpassword123" vuhitra-redis redis-cli ping > /dev/null 2>&1; then
            echo "Redis is ready!"
            break
          fi
          echo "Waiting for Redis... ($i/30)"
          sleep 2
        done
        
        echo "Waiting for Flask app to be ready..."
        for i in {1..30}; do
          if curl -f http://localhost:18001/health > /dev/null 2>&1; then
            echo "Flask app is ready!"
            break
          fi
          echo "Waiting for Flask app... ($i/30)"
          sleep 2
        done
    
    - name: Run tests
      env:
        REDIS_PASSWORD: testpassword123
      run: |
        chmod +x run_tests.sh
        ./run_tests.sh -v
    
    - name: Show container logs on failure
      if: failure()
      run: |
        cd services
        docker compose logs
    
    - name: Stop sandbox container
      if: always()
      run: |
        cd services
        export REDIS_PASSWORD=testpassword123
        docker compose down -v
    
    - name: Upload coverage reports
      uses: codecov/codecov-action@v4
      if: matrix.python-version == '3.12'
      with:
        fail_ci_if_error: false
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

