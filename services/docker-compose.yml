version: '3.8'

services:
  # PostgreSQL service - Built from Dockerfile
  # Part of app profile (needed by sandbox for data analysis)
  postgres:
    build:
      context: ..
      dockerfile: services/postgres/Dockerfile
    image: vuhitra-postgres:latest
    container_name: vuhitra-postgres
    profiles:
      - app
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:${POSTGRES_CONTAINER_PORT:-5432}"     # PostgreSQL port (localhost only for security)
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-vuhitra}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD environment variable is required}
      - POSTGRES_DB=${POSTGRES_DB:-vuhitra}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vuhitra -d vuhitra"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - vuhitra-network

  # Redis service - Built from Dockerfile
  # Part of app profile (needed by sandbox)
  redis:
    build:
      context: ..
      dockerfile: services/redis/Dockerfile
    image: vuhitra-redis:latest
    container_name: vuhitra-redis
    profiles:
      - app
    ports:
      - "${REDIS_HOST_PORT:-16379}:${REDIS_CONTAINER_PORT:-6379}"     # Redis port
    volumes:
      - redis_data:/data
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD environment variable is required}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - vuhitra-network

  # Sandbox service - Built from Dockerfile
  # Start with: docker compose --profile app up -d
  sandbox:
    build:
      context: ..
      dockerfile: services/sandbox/Dockerfile
    image: vuhitra-sandbox:latest
    container_name: vuhitra-sandbox
    profiles:
      - app
    ports:
      - "${SANDBOX_HOST_PORT:-18001}:${SANDBOX_CONTAINER_PORT:-8000}"     # App port
    volumes:
      - workspace:/app/WORKSPACE
      - ${VUHITRA_DIR:-..}/.vuhitra:/app/.vuhitra:ro  # Mount .vuhitra directory for context access (read-only, set VUHITRA_DIR to override base path)
      - ${VUHITRA_DIR:-..}/mcps:/app/mcps:ro  # Mount MCP servers for tool list queries (read-only)
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=${REDIS_CONTAINER_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD environment variable is required}
      - ELASTICSEARCH_HOST=elasticsearch
      - ELASTICSEARCH_PORT=${ELASTICSEARCH_HTTP_CONTAINER_PORT:-9200}
      - ELASTICSEARCH_INDEX=llm_feedback
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=${POSTGRES_CONTAINER_PORT:-5432}
      - POSTGRES_USER=${POSTGRES_USER:-vuhitra}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD environment variable is required}
      - POSTGRES_DB=${POSTGRES_DB:-vuhitra}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${SANDBOX_CONTAINER_PORT:-8000}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - vuhitra-network

  # Transformer service - NLP service for code recognition, context compaction, and sentiment analysis
  # Start with: docker compose --profile app up -d
  transformer:
    build:
      context: ..
      dockerfile: services/transformer/Dockerfile
    image: vuhitra-transformer:latest
    container_name: vuhitra-transformer
    profiles:
      - app
    ports:
      - "${TRANSFORMER_HOST_PORT:-16050}:${TRANSFORMER_CONTAINER_PORT:-5050}"     # Transformer service port
    volumes:
      - transformer_models:/root/.cache/huggingface  # Cache HuggingFace models
    environment:
      - FLASK_DEBUG=false
      - ENVIRONMENT=${ENVIRONMENT:-DEV}
      - SENTRY_DSN=${SENTRY_DSN:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${TRANSFORMER_CONTAINER_PORT:-5050}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s  # Longer start period for model loading
    restart: unless-stopped
    networks:
      - vuhitra-network

  # Spark services (optional - use profile to enable)
  # Start with: docker compose --profile spark up -d
  spark:
    image: ghcr.io/nexus-mdg/spark-3.5:latest
    restart: always
    container_name: vuhitra-spark-master
    profiles:
      - spark
    env_file:
      - .env
    environment:
      - SPARK_MODE=${SPARK_MODE}
      - SPARK_RPC_AUTHENTICATION_ENABLED=${SPARK_RPC_AUTHENTICATION_ENABLED}
      - SPARK_RPC_ENCRYPTION_ENABLED=${SPARK_RPC_ENCRYPTION_ENABLED}
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=${SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED}
      - SPARK_SSL_ENABLED=${SPARK_SSL_ENABLED}
      - SPARK_MASTER_HOST=${SPARK_MASTER_HOST}
      - SPARK_MASTER_WEBUI_PORT=${SPARK_MASTER_WEBUI_PORT}
      - PYSPARK_PYTHON=${PYSPARK_PYTHON}
    ports:
      - "${SPARK_MASTER_HOST_PORT:-7077}:${SPARK_MASTER_CONTAINER_PORT:-7077}"     # Spark master port
      - "${SPARK_MASTER_WEBUI_HOST_PORT:-8081}:${SPARK_MASTER_WEBUI_CONTAINER_PORT:-8081}"     # Spark master Web UI
    volumes:
      - spark-data:/opt/bitnami/spark/data
      - ./spark-apps:/opt/bitnami/spark/apps
    networks:
      - vuhitra-network

  spark-worker:
    image: ghcr.io/nexus-mdg/spark-3.5:latest
    container_name: vuhitra-spark-worker
    restart: always
    profiles:
      - spark
    env_file:
      - .env
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=${SPARK_MASTER_URL}
      - SPARK_WORKER_WEBUI_PORT=${SPARK_WORKER_WEBUI_PORT}
      - PYSPARK_PYTHON=${PYSPARK_PYTHON}
    depends_on:
      - spark
    networks:
      - vuhitra-network

  # Elasticsearch service - Built from Dockerfile
  # Part of app and dev profiles (needed by sandbox and kibana)
  elasticsearch:
    build:
      context: ..
      dockerfile: services/elasticsearch/Dockerfile
    image: vuhitra-elasticsearch:latest
    container_name: vuhitra-elasticsearch
    profiles:
      - app
      - dev
    ports:
      - "${ELASTICSEARCH_HTTP_HOST_PORT:-9200}:${ELASTICSEARCH_HTTP_CONTAINER_PORT:-9200}"      # HTTP API
      - "${ELASTICSEARCH_TRANSPORT_HOST_PORT:-9300}:${ELASTICSEARCH_TRANSPORT_CONTAINER_PORT:-9300}"      # Transport
    volumes:
      - elasticsearch_data:/var/lib/elasticsearch
      - elasticsearch_logs:/var/log/elasticsearch
    environment:
      - discovery.type=single-node
      - cluster.name=vuhitra-cluster
      - node.name=vuhitra-node-1
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${ELASTICSEARCH_HTTP_CONTAINER_PORT:-9200}/_cluster/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - vuhitra-network

  # Kibana service - UI for Elasticsearch (optional dev tool)
  # Start with: docker compose --profile dev up -d (or --profile app for full stack)
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: vuhitra-kibana
    profiles:
      - dev
      - app
    ports:
      - "${KIBANA_HOST_PORT:-5601}:${KIBANA_CONTAINER_PORT:-5601}"      # Kibana Web UI
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:${ELASTICSEARCH_HTTP_CONTAINER_PORT:-9200}
      - SERVER_NAME=vuhitra-kibana
      - xpack.security.enabled=false
      - xpack.encryptedSavedObjects.encryptionKey=fhjskloppd678ehkdfdlliverpoolfcr
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${KIBANA_CONTAINER_PORT:-5601}/api/status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - vuhitra-network

  # Ollama service - Optional LLM inference server
  # Start with: docker compose --profile ollama up -d
  # Uses lightweight model (tinyllama) that works on both CPU and GPU
  ollama:
    image: ollama/ollama:latest
    container_name: vuhitra-ollama
    profiles:
      - ollama
    ports:
      - "${OLLAMA_HOST_PORT:-11434}:${OLLAMA_CONTAINER_PORT:-11434}"    # Ollama API port
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - vuhitra-network
    # Optional: GPU support (uncomment if NVIDIA GPU available)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # Ollama model initialization - pulls tinyllama on first start
  # This is a one-time setup container that uses curl to interact with the Ollama API
  ollama-setup:
    image: curlimages/curl:latest
    container_name: vuhitra-ollama-setup
    profiles:
      - ollama
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: /bin/sh
    command: >
      -c "
      echo 'Waiting for Ollama service to be ready...' &&
      sleep 5 &&
      echo 'Pulling tinyllama model (lightweight, ~1GB, CPU-friendly)...' &&
      curl -X POST http://ollama:${OLLAMA_CONTAINER_PORT:-11434}/api/pull -d '{\"name\":\"tinyllama\"}' &&
      echo '' &&
      echo 'Model pull request sent successfully!' &&
      echo 'Waiting for model to finish downloading...' &&
      sleep 30 &&
      echo 'Testing model with a simple prompt...' &&
      curl -X POST http://ollama:${OLLAMA_CONTAINER_PORT:-11434}/api/generate -d '{\"model\":\"tinyllama\",\"prompt\":\"Say hello\",\"stream\":false}' &&
      echo '' &&
      echo 'Ollama setup complete!'
      "
    networks:
      - vuhitra-network
    restart: "no"

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  workspace:
    driver: local
  spark-data:
    driver: local
  elasticsearch_data:
    driver: local
  elasticsearch_logs:
    driver: local
  ollama_data:
    driver: local
  transformer_models:
    driver: local

networks:
  vuhitra-network:
    name: vuhitra-network
    driver: bridge
