# Configuration file for vuhitra-cli
# This file contains settings for the LLM CLI application
# Copy this file to config.yaml and modify according to your needs

# CLI settings
cli:
  # Default prompt behavior, timeout, etc.
  default_timeout: 30
  # Enable/disable feedback collection in interactive mode
  # When enabled, users will be prompted to rate their satisfaction (0-5) after each response
  # 0=Disappointed, 1=Very dissatisfied, 2=Dissatisfied, 3=Neutral, 4=Satisfied, 5=Very satisfied
  enable_feedback: true
  # Auto-iteration settings (for rating=0 responses)
  auto_iteration_timeout_seconds: 3  # Wait time before auto-retry
  auto_iteration_max_iterations: 5   # Maximum number of retry attempts
  auto_iteration_negative_weight_increment: 0.1  # Increment for negative heuristic weight per iteration

# Model configuration
model:
  # Default models per environment
  # When using local Ollama, tinyllama is used (lightweight, CPU-friendly)
  # When using remote Ollama, llama3.1:8b is used (more powerful, requires better hardware)
  default:
    local: tinyllama
    remote: llama3.1:8b
  
  # Available models list
  available:
    - tinyllama              # Lightweight model (~1GB, CPU-friendly, included in docker-compose)
    - llama3.1:8b
    - qwen3-vl:8b
    - qwen3:latest
    - qwen2-math:1.5b
    - qwen2-math:7b
    - qwen2.5-coder:7b-instruct-q5_K_M
    - qwen2.5-coder:14b-instruct-q4_K_M
    - qwen2.5-coder:3b
    - qwen2.5-coder:7b-instruct-q4_K_M
    - qwen2.5-coder:7b

# Ollama server configuration
# Set 'use' to either 'local' or 'remote' to select which configuration to use
ollama:
  # Which configuration to use: 'local' (docker-compose) or 'remote' (external server)
  use: local

  # Local Ollama (docker-compose service)
  # Start with: cd services && docker compose --profile ollama up -d
  # Default model: tinyllama (lightweight, ~1GB, CPU-friendly)
  local:
    host: localhost
    protocol: http
    port: 11434
    api_path: /api/generate

  # Remote Ollama (external/network server)
  # Configure your remote Ollama server details here
  # Default model: llama3.1:8b (more powerful, requires GPU or powerful CPU)
  remote:
    host: 192.168.31.23
    protocol: http
    port: 11434
    api_path: /api/generate

# Environment configuration
environment:
  # Mode: DEV or PROD (default: DEV)
  mode: DEV
  # Enable logging in DEV mode
  enable_logging: true

# Sentry configuration for error tracking
sentry:
  # Sentry DSN (leave empty to disable Sentry)
  dsn: ""
  # Environment name for Sentry
  environment: development
  # Enable tracing
  traces_sample_rate: 1.0
  # Send default PII (Personally Identifiable Information)
  send_default_pii: false
  # Attach stacktrace
  attach_stacktrace: true

# Sandbox service configuration
# Port 18001 is the docker-compose mapped port (internal: 8000)
sandbox:
  host: localhost
  port: 18001
  protocol: http
  # Confidence threshold for heuristics context injection (0.0-1.0)
  confidence_threshold: 0.75

# Transformer service configuration
# Port 16050 is the docker-compose mapped port (internal: 5050)
transformer:
  host: localhost
  port: 16050
  protocol: http

# Redis service configuration
# Port 16379 is the docker-compose mapped port (internal: 6379)
# This Redis instance is used by the sandbox service and token limit manager
redis:
  host: localhost
  port: 16379

# ElasticSearch configuration
elasticsearch:
  host: localhost
  port: 9200
  index: llm_feedback

# Ephemeral context configuration
# Ephemeral context allows loading files into session context that persist until cleared
ephemeral_context:
  # Enable/disable ephemeral context feature
  enabled: true
  # Maximum file size in MB that can be loaded
  max_file_size_mb: 10
  # Maximum number of simultaneous contexts
  max_contexts: 10
  # Text chunking configuration (for large files)
  chunking:
    enabled: true
    # Chunk size in words
    chunk_size: 1000
    # Overlap between chunks in words
    overlap: 200

# Eternal context configuration
# Eternal context persists across sessions (permanent until explicitly deleted)
eternal_context:
  # Enable/disable eternal context feature
  enabled: true
  # Storage directory for eternal contexts (relative to project root or absolute path)
  storage_dir: .vuhitra/eternal_contexts
  # Maximum file size in MB that can be loaded
  max_file_size_mb: 10
  # Maximum number of eternal contexts
  max_contexts: 20
  # Text chunking configuration (for large files)
  chunking:
    enabled: true
    # Chunk size in words
    chunk_size: 1000
    # Overlap between chunks in words
    overlap: 200
