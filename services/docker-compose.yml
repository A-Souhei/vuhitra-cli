version: '3.8'

services:
  # Redis with RediSearch (Vector Search) - Built from Dockerfile
  cache:
    build:
      context: ..
      dockerfile: services/cache/Dockerfile
    image: vuhitra-cache:latest
    container_name: vuhitra-redis
    ports:
      - "16379:6379"     # Redis port
      - "18001:8000"     # App port
    volumes:
      - redis_data:/data
    environment:
      - REDIS_ARGS=--save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - vuhitra-network


volumes:
  redis_data:
    driver: local

networks:
  vuhitra-network:
    driver: bridge
