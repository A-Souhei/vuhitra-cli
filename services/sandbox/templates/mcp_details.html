<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔌 MCP Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/mcps.css') }}">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container">
            <a class="navbar-brand" href="/home">
                <i class="bi bi-house-fill"></i> Vuhitra CLI
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/home">
                            <i class="bi bi-house"></i> Home
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/eternals">
                            <i class="bi bi-infinity"></i> Eternals
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/pillars">
                            <i class="bi bi-building"></i> Pillars
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/ephemerals">
                            <i class="bi bi-clock-history"></i> Ephemerals
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/vanishers">
                            <i class="bi bi-eye-slash"></i> Vanishers
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/mirrors">
                            <i class="bi bi-folder-symlink"></i> Mirrors
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/mcps">
                            <i class="bi bi-plugin"></i> MCPs
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="main-content">
        <div class="container">
            <div class="container-custom">
                <!-- Breadcrumb -->
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a href="/home">Home</a></li>
                        <li class="breadcrumb-item"><a href="/mcps">MCPs</a></li>
                        <li class="breadcrumb-item active" aria-current="page" id="breadcrumbMcpName">Loading...</li>
                    </ol>
                </nav>

                <div id="message"></div>

                <div id="mcpDetailsContainer">
                    <div class="text-center py-5">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                        <p class="text-muted mt-2">Loading MCP details...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <p class="mb-1">
                <i class="bi bi-c-circle"></i> 2025 Vuhitra CLI -
                Licensed under <a href="https://opensource.org/licenses/MIT" target="_blank">MIT License</a>
            </p>
            <p class="mb-0">
                <i class="bi bi-github"></i>
                <a href="https://github.com/A-Souhei/vuhitra-cli" target="_blank">View on GitHub</a>
            </p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const mcpId = "{{ mcp_id }}";

        document.addEventListener('DOMContentLoaded', function() {
            loadMCPDetails();
        });

        function loadMCPDetails() {
            const container = document.getElementById('mcpDetailsContainer');

            fetch(`/api/mcps/${mcpId}`)
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        displayMCPDetails(data.mcp);
                    } else {
                        container.innerHTML = `
                            <div class="alert alert-danger">
                                <i class="bi bi-exclamation-triangle"></i> ${data.error || 'Failed to load MCP details'}
                            </div>
                        `;
                    }
                })
                .catch(error => {
                    container.innerHTML = `
                        <div class="alert alert-danger">
                            <i class="bi bi-exclamation-triangle"></i> Error: ${error.message}
                        </div>
                    `;
                });
        }

        function displayMCPDetails(mcp) {
            // Update breadcrumb
            document.getElementById('breadcrumbMcpName').textContent = mcp.name;

            // Update page title
            document.title = `🔌 ${mcp.name}`;

            const container = document.getElementById('mcpDetailsContainer');

            const statusBadge = mcp.enabled
                ? '<span class="badge bg-success">Enabled</span>'
                : '<span class="badge bg-secondary">Disabled</span>';

            const alwaysEnabledBadge = mcp.always_enabled
                ? '<span class="badge bg-primary ms-2">Always ON</span>'
                : '';

            let html = `
                <div class="card mb-4">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h4 class="mb-0">
                            <i class="bi bi-plugin"></i> ${mcp.name}
                        </h4>
                        <div>
                            ${statusBadge}
                            ${alwaysEnabledBadge}
                        </div>
                    </div>
                    <div class="card-body">
                        <h6><i class="bi bi-info-circle"></i> Information</h6>
                        <table class="table table-sm">
                            <tr><th style="width: 20%;">ID:</th><td><code>${mcp.id}</code></td></tr>
                            <tr><th>Description:</th><td>${mcp.description}</td></tr>
                            <tr><th>Status:</th><td>${statusBadge}</td></tr>
                            <tr><th>Always Enabled:</th><td>${mcp.always_enabled ? 'Yes (coding mode)' : 'No'}</td></tr>
                            <tr><th>Tools:</th><td>${mcp.tools_count}</td></tr>
                            <tr><th>Resources:</th><td>${mcp.resources_count}</td></tr>
                            <tr><th>Registered:</th><td>${formatDate(mcp.registered_at)}</td></tr>
                        </table>
            `;

            // Add toggle button if allowed
            if (!mcp.always_enabled) {
                html += `
                    <div class="mt-3">
                        <button class="btn btn-${mcp.enabled ? 'warning' : 'success'}"
                                onclick="toggleMCP('${mcp.id}', ${!mcp.enabled})">
                            <i class="bi bi-power"></i> ${mcp.enabled ? 'Disable' : 'Enable'} MCP
                        </button>
                    </div>
                `;
            }

            html += `
                    </div>
                </div>

                <div class="card mb-4">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="bi bi-tools"></i> Tools (${mcp.tools.length})</h5>
                    </div>
                    <div class="card-body">
            `;

            if (mcp.tools.length > 0) {
                html += '<div class="list-group">';
                mcp.tools.forEach(tool => {
                    html += `
                        <div class="list-group-item">
                            <div class="d-flex w-100 justify-content-between">
                                <h6 class="mb-1"><code>${tool.name}</code></h6>
                            </div>
                            <p class="mb-0 text-muted">${tool.description}</p>
                        </div>
                    `;
                });
                html += '</div>';
            } else {
                html += '<p class="text-muted">No tools available</p>';
            }

            html += `
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="bi bi-file-earmark"></i> Resources (${mcp.resources.length})</h5>
                    </div>
                    <div class="card-body">
            `;

            if (mcp.resources.length > 0) {
                html += '<div class="list-group">';
                mcp.resources.forEach(resource => {
                    html += `
                        <div class="list-group-item">
                            <div class="d-flex w-100 justify-content-between">
                                <h6 class="mb-1">${resource.name}</h6>
                                <small class="text-muted">${resource.type}</small>
                            </div>
                            <p class="mb-0 text-muted">${resource.description}</p>
                        </div>
                    `;
                });
                html += '</div>';
            } else {
                html += '<p class="text-muted">No resources available</p>';
            }

            html += `
                    </div>
                </div>

                <div class="mt-4">
                    <a href="/mcps" class="btn btn-secondary">
                        <i class="bi bi-arrow-left"></i> Back to MCPs
                    </a>
                </div>
            `;

            container.innerHTML = html;
        }

        function toggleMCP(mcpId, enabled) {
            fetch(`/api/mcps/${mcpId}/toggle`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ enabled: enabled })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showSuccess(`MCP ${enabled ? 'enabled' : 'disabled'} successfully`);
                    // Reload the page to show updated status
                    setTimeout(() => location.reload(), 1000);
                } else {
                    showError(data.error || 'Failed to toggle MCP');
                }
            })
            .catch(error => {
                showError('Error toggling MCP: ' + error.message);
            });
        }

        function formatDate(dateString) {
            if (!dateString) return 'N/A';
            const date = new Date(dateString);
            return date.toLocaleString();
        }

        function showSuccess(message) {
            const messageDiv = document.getElementById('message');
            messageDiv.innerHTML = `
                <div class="alert alert-success alert-dismissible fade show" role="alert">
                    <i class="bi bi-check-circle"></i> ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            `;
            setTimeout(() => messageDiv.innerHTML = '', 5000);
        }

        function showError(message) {
            const messageDiv = document.getElementById('message');
            messageDiv.innerHTML = `
                <div class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="bi bi-exclamation-triangle"></i> ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            `;
        }
    </script>
</body>
</html>
